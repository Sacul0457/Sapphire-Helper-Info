                    "type": 10,
                    "content": "## <#1023653278485057596> Tags\n- **Unanswered** - Added to posts as soon as they are created and removed on a message from any user that isn't OP - can be used when searching for posts where OP hasn't received any answer yet.\n- **Not solved** - Added to posts when unanswered is removed, just a way to search for posts that aren't solved but also not ones where OP hasn't received any answer yet.\n- **Waiting for reply** - Posts with not solved where the last message is from OP and is older than 10 minutes - waiting for a reply from someone who is helping.\n\nNote: *A post having needs-dev-review tag makes it excluded from all of those tags.*"

                    "type": 10,
                    "content": "## EPI\n- </epi enable:1341875324413153522>\n  - Embeds will automatically be sent to posts when they are created saying that Sapphire is experiencing issues. Includes a custom message (text) if it was used or the link of  `status_message_id` - a message from ⁠<#840710941069934632>.\n  - If *sticky* is `True` a sticky message is created in ⁠general﹙no-help﹚. Additionaly, both messages have a button for users to be notified when the issue is resolved.\n- </epi disable:1341875324413153522> - Ping all users that asked to be notified when the issue is resolved, stop the sticky message (if enabled). If `message` is used, it will be included in the message pinging the users.\n- </epi edit:1341875324413153522> - Update the current EPI config. At least one need of the arguments need to be edited. To remove something, enter `-`."

                    "type": 10,
                    "content": "## ReadTheDamnRules (RTDR)\n- Creates a post for users that ask for help in ⁠<#866339087732703252>, ⁠feedback (under any thread), ⁠support or any other public channel with all of the info (content and attachment) that they provided. \n- It can be triggered by adding ❓ or ❔ to the message or replying with <@1134607785947037848> `<post title, defaults to Support for ${username}>`.\n- Make sure to react/reply to the oldest/highest message as only that message and messages lower (from the same user) will be used in the new post."
